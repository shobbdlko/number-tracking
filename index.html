<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client-Server Location Share</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    h2 { margin-top: 0; color: #333; }
    p { color: #666; font-size: 14px; }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      margin-top: 15px;
    }
    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
    }
    .info { background: #e7f3ff; color: #004085; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Device Location Sharing</h2>
    <p>Apni current GPS location backend server par save karne ke liye button par click karein.</p>
    
    <button id="send-btn">Location Share Karein</button>
    <div id="status" class="info" style="display: none;"></div>
  </div>

  <script>
    const btn = document.getElementById('send-btn');
    const statusDiv = document.getElementById('status');

    function showStatus(text, type) {
      statusDiv.style.display = 'block';
      statusDiv.textContent = text;
      statusDiv.className = type;
    }

    btn.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        showStatus('Aapka browser Geolocation API support nahi karta.', 'error');
        return;
      }

      btn.disabled = true;
      showStatus('Location permission ka intezar hai...', 'info');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          showStatus('Location mil gayi, server par bhej rahe hain...', 'info');

          const payload = {
            userId: "USER_" + Math.floor(1000 + Math.random() * 9000),
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: new Date().toISOString()
          };

          try {
            const res = await fetch('/api/save-location', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
              showStatus(data.message, 'success');
            } else {
              showStatus('Server Error: ' + data.error, 'error');
            }
          } catch (err) {
            showStatus('Network Error: Server connect nahi ho saka.', 'error');
          } finally {
            btn.disabled = false;
          }
        },
        (error) => {
          btn.disabled = false;
          switch(error.code) {
            case error.PERMISSION_DENIED:
              showStatus('Aapne location permission deny kar di.', 'error');
              break;
            case error.POSITION_UNAVAILABLE:
              showStatus('GPS signal nahi mil saka.', 'error');
              break;
            case error.TIMEOUT:
              showStatus('Request timeout ho gayi.', 'error');
              break;
            default:
              showStatus('Anjaan error aayi.', 'error');
          }
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  </script>

</body>
</html>
