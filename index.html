<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-TRACE // Device Location Share</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
      tailwind.config = {
          darkMode: 'class',
          theme: {
              extend: {
                  colors: {
                      cyber: {
                          black: '#050811',
                          dark: '#0a0f1d',
                          cyan: '#00f3ff',
                          magenta: '#ff0055',
                          green: '#00ff66',
                          amber: '#ffb700'
                      }
                  },
                  fontFamily: {
                      orbitron: ['Orbitron', 'sans-serif'],
                      mono: ['"Share Tech Mono"', 'monospace'],
                      rajdhani: ['Rajdhani', 'sans-serif']
                  }
              }
          }
      }
  </script>

  <style>
    body {
        background-color: #050811;
        color: #00f3ff;
        font-family: 'Rajdhani', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 60%),
            linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    /* Scanline Overlay */
    .scanlines {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        pointer-events: none;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 999;
        opacity: 0.7;
    }

    .cyber-border {
        border: 1px solid rgba(0, 243, 255, 0.4);
        position: relative;
        background: rgba(10, 15, 29, 0.9);
        backdrop-filter: blur(8px);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }

    .cyber-btn {
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        transition: all 0.2s ease;
    }
    .cyber-btn:hover {
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        transform: translateY(-1px);
    }
  </style>
</head>
<body class="p-4 relative">

  <div class="scanlines"></div>

  <div class="cyber-border p-8 rounded-sm max-w-md w-full text-center font-mono">
    <div class="flex items-center justify-center gap-2 mb-4 text-cyber-magenta">
        <i class="fa-solid fa-satellite-dish text-2xl animate-pulse"></i>
        <h2 class="font-orbitron font-bold text-xl text-white tracking-wider">SECURE LINK // GPS SHARING</h2>
    </div>
    
    <p class="text-gray-300 text-xs mb-6 leading-relaxed">
      अपनी वर्तमान जीपीएस लोकेशन सुरक्षित रूप से सर्वर पर सिंक करने के लिए नीचे दिए गए बटन पर क्लिक करें।
    </p>
    
    <button id="send-btn" class="cyber-btn w-full bg-cyber-cyan text-black font-orbitron font-bold py-3.5 px-4 rounded-sm hover:bg-cyan-400 transition text-sm tracking-wider">
      <i class="fa-solid fa-location-crosshairs mr-2"></i> LOCATION SHARE KAREIN
    </button>
    
    <div id="status" class="mt-4 p-3 rounded text-xs hidden font-mono"></div>
  </div>

  <script>
    const btn = document.getElementById('send-btn');
    const statusDiv = document.getElementById('status');

    function showStatus(text, type) {
      statusDiv.style.display = 'block';
      statusDiv.textContent = text;
      
      if (type === 'success') {
          statusDiv.className = 'mt-4 p-3 rounded text-xs font-mono bg-cyber-green/20 text-cyber-green border border-cyber-green/40';
      } else if (type === 'error') {
          statusDiv.className = 'mt-4 p-3 rounded text-xs font-mono bg-cyber-magenta/20 text-cyber-magenta border border-cyber-magenta/40';
      } else {
          statusDiv.className = 'mt-4 p-3 rounded text-xs font-mono bg-cyber-cyan/20 text-cyber-cyan border border-cyber-cyan/40';
      }
    }

    btn.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        showStatus('Aapka browser Geolocation API support nahi karta.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-2"></i> FETCHING GPS...`;
      showStatus('Location permission ka intezar hai...', 'info');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          showStatus('Location mil gayi, server par bhej rahe hain...', 'info');

          const payload = {
            userId: "USER_" + Math.floor(1000 + Math.random() * 9000),
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: new Date().toISOString()
          };

          try {
            const res = await fetch('https://number-tracking.onrender.com/api/save-location', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
              showStatus(data.message || 'Location safaltapoorvak save ho gayi hai!', 'success');
            } else {
              showStatus('Server Error: ' + (data.error || 'Unknown'), 'error');
            }
          } catch (err) {
            showStatus('Network Error: Server connect nahi ho saka.', 'error');
          } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-location-crosshairs mr-2"></i> LOCATION SHARE KAREIN`;
          }
        },
        (error) => {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-location-crosshairs mr-2"></i> LOCATION SHARE KAREIN`;
          switch(error.code) {
            case error.PERMISSION_DENIED:
              showStatus('Aapne location permission deny kar di.', 'error');
              break;
            case error.POSITION_UNAVAILABLE:
              showStatus('GPS signal nahi mil saka.', 'error');
              break;
            case error.TIMEOUT:
              showStatus('Request timeout ho gayi.', 'error');
              break;
            default:
              showStatus('Anjaan error aayi.', 'error');
          }
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  </script>

</body>
</html>
