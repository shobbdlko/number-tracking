<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-TRACE // Admin Dashboard - Saved Locations</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
      tailwind.config = {
          darkMode: 'class',
          theme: {
              extend: {
                  colors: {
                      cyber: {
                          black: '#050811',
                          dark: '#0a0f1d',
                          cyan: '#00f3ff',
                          magenta: '#ff0055',
                          green: '#00ff66',
                          amber: '#ffb700'
                      }
                  },
                  fontFamily: {
                      orbitron: ['Orbitron', 'sans-serif'],
                      mono: ['"Share Tech Mono"', 'monospace'],
                      rajdhani: ['Rajdhani', 'sans-serif']
                  }
              }
          }
      }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #050811;
      color: #00f3ff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-image: 
          radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 60%),
          linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    /* Scanline Overlay */
    .scanlines {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        pointer-events: none;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 999;
        opacity: 0.7;
    }

    .cyber-border {
        border: 1px solid rgba(0, 243, 255, 0.4);
        position: relative;
        background: rgba(10, 15, 29, 0.9);
        backdrop-filter: blur(8px);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }

    .cyber-btn {
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        transition: all 0.2s ease;
    }
    .cyber-btn:hover {
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        transform: translateY(-1px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid rgba(0, 243, 255, 0.15);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
    }
    th {
      background-color: rgba(0, 243, 255, 0.08);
      color: #00f3ff;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    tr:hover { background-color: rgba(0, 243, 255, 0.05); }
    
    .map-btn {
      display: inline-block;
      background-color: rgba(0, 243, 255, 0.2);
      color: #00f3ff;
      border: 1px solid #00f3ff;
      padding: 5px 12px;
      text-decoration: none;
      border-radius: 3px;
      font-size: 12px;
      transition: all 0.2s;
    }
    .map-btn:hover { 
      background-color: #00f3ff; 
      color: #050811;
      box-shadow: 0 0 10px #00f3ff;
    }
    .no-data {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
      font-size: 14px;
      font-family: 'Share Tech Mono', monospace;
    }
  </style>
</head>
<body class="relative">

  <div class="scanlines"></div>

  <div class="container max-w-5xl mx-auto cyber-border p-6 rounded-sm">
    <div class="header flex justify-between items-center mb-6 border-b border-cyber-cyan/30 pb-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-database text-cyber-cyan text-xl animate-pulse"></i>
        <h2 class="font-orbitron text-lg md:text-xl font-bold text-white tracking-wider">SAVED CLIENT LOCATIONS // TELEMETRY</h2>
      </div>
      <button class="cyber-btn btn-refresh bg-cyber-green text-black font-orbitron font-bold py-2 px-4 text-xs cursor-pointer tracking-wider" onclick="fetchLocations()">
        <i class="fa-solid fa-rotate mr-1"></i> REFRESH DATA
      </button>
    </div>

    <div class="overflow-x-auto">
      <table>
        <thead>
          <tr>
            <th>User ID / Target</th>
            <th>Latitude</th>
            <th>Longitude</th>
            <th>Accuracy</th>
            <th>Timestamp</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="locations-table-body">
          <tr>
            <td colspan="6" class="no-data">Loading locations telemetry data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchLocations() {
      const tableBody = document.getElementById('locations-table-body');
      
      try {
        // यदि आपका सर्वर किसी दूसरे पोर्ट या लाइव लिंक पर है, तो पूरा URL दें जैसे: 'https://number-tracking.onrender.com/api/view-locations'
        const response = await fetch('/api/view-locations');
        const data = await response.json();

        if (!data || data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6" class="no-data">Abhi tak koi location record save nahi hua hai.</td></tr>`;
          return;
        }

        tableBody.innerHTML = ''; // Clear table

        data.forEach(item => {
          const row = document.createElement('tr');
          
          const mapUrl = `https://www.google.com/maps?q=${item.latitude},${item.longitude}`;
          const formattedDate = new Date(item.timestamp).toLocaleString();

          row.innerHTML = `
            <td><strong class="text-cyber-cyan">${item.userId}</strong></td>
            <td class="text-gray-300">${item.latitude}</td>
            <td class="text-gray-300">${item.longitude}</td>
            <td class="text-gray-300">${item.accuracy || 'N/A'}</td>
            <td class="text-gray-400 text-xs">${formattedDate}</td>
            <td>
              <a href="${mapUrl}" target="_blank" class="map-btn">Google Maps</a>
            </td>
          `;

          tableBody.appendChild(row);
        });

      } catch (error) {
        console.error('Error fetching data:', error);
        tableBody.innerHTML = `<tr><td colspan="6" class="no-data" style="color:#ff0055;">Data load karne mein error aayi. Server active hai ya nahi check karein.</td></tr>`;
      }
    }

    // Page load hone par auto-fetch karein
    window.addEventListener('DOMContentLoaded', fetchLocations);
  </script>

</body>
</html>
